name: AIOpsLab revoke-auth paired control (no model)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  revoke-auth-paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Install Python and Helm
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - name: Install pinned Kind
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLo /tmp/kind https://kind.sigs.k8s.io/dl/v0.27.0/kind-linux-amd64
          echo 'a6875aaea358acf0ac07786b1a6755d08fd640f4c79b7a2e46681cc13f49a04b  /tmp/kind' | sha256sum -c -
          chmod +x /tmp/kind
          /tmp/kind version
          kubectl version --client=true
      - name: Fetch pinned AIOpsLab release and application
        shell: bash
        run: |
          set -euo pipefail
          git clone --recurse-submodules --filter=blob:none https://github.com/microsoft/AIOpsLab.git /tmp/aiopslab
          git -C /tmp/aiopslab checkout --detach 576c3f080c7ae2459a972afd4a2f8d5f01828430
          git -C /tmp/aiopslab submodule update --init --recursive
          test "$(git -C /tmp/aiopslab/aiopslab-applications rev-parse HEAD)" = 8038be6b4989c647126f27715acc591c47133c2d
          test -d /tmp/aiopslab/aiopslab-applications/hotelReservation/kubernetes
          cp /tmp/aiopslab/aiopslab/config.yml.example /tmp/aiopslab/aiopslab/config.yml
          sed -i 's/^k8s_host:.*/k8s_host: kind/' /tmp/aiopslab/aiopslab/config.yml
          sed -i 's/^k8s_user:.*/k8s_user: runner/' /tmp/aiopslab/aiopslab/config.yml
          sed -i 's/^qualitative_eval:.*/qualitative_eval: false/' /tmp/aiopslab/aiopslab/config.yml
      - name: Create native amd64 Kind cluster
        shell: bash
        run: |
          set -euo pipefail
          /tmp/kind create cluster --name kind --config /tmp/aiopslab/kind/kind-config-x86.yaml --wait 180s
          test "$(kubectl get nodes -o jsonpath='{.items[0].status.nodeInfo.architecture}')" = amd64
      - name: Run both mechanical arms
        working-directory: /tmp/aiopslab
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e .
          python - <<'PY'
          import atexit, json, shlex, time
          from aiopslab.orchestrator import Orchestrator
          from aiopslab.orchestrator.orchestrator import exit_cleanup_fault
          NS='test-hotel-reservation'; DEPLOY='mongodb-geo'; SELECTOR='io.kompose.service=mongodb-geo'
          def ex(o,c): return o.kubectl.exec_command(c).strip()
          def pod(o):
              p=ex(o,f"kubectl get pods -n {NS} -l {SELECTOR} -o jsonpath='{{.items[0].metadata.name}}'")
              if not p: raise RuntimeError('mongodb-geo pod not found')
              return p
          def ready(o): ex(o,f'kubectl wait -n {NS} --for=condition=Ready pod -l {SELECTOR} --timeout=180s')
          def frontend(o): return ex(o,f"kubectl get deployment frontend -n {NS} -o jsonpath='{{.status.readyReplicas}}/{{.spec.replicas}}'")=='1/1'
          def args(o):
              v=ex(o,f"kubectl get deployment {DEPLOY} -n {NS} -o jsonpath='{{.spec.template.spec.containers[0].args[*]}}'")
              return v.split() if v else []
          def role(o):
              n=shlex.quote(pod(o))
              a=ex(o,f"kubectl exec -n {NS} {n} -- mongo admin -u admin -p admin --authenticationDatabase admin --quiet --eval 'JSON.stringify(db.runCommand({{connectionStatus:1}}).authInfo.authenticatedUsers)'")
              r=ex(o, f"""kubectl exec -n {NS} {n} -- mongo admin -u admin -p admin --authenticationDatabase admin --quiet --eval 'JSON.stringify(db.getUser("admin").roles)'""")
              return {'authenticated':'admin' in a,'readWrite_geo_db':'readWrite' in r and 'geo-db' in r,'raw_auth':a,'raw_roles':r}
          def unauth(o): return ex(o,f"kubectl exec -n {NS} {shlex.quote(pod(o))} -- mongo --quiet --host 127.0.0.1 --eval 'db.runCommand({{ping:1}}).ok'")
          def restart(o):
              old=pod(o); ex(o,f'kubectl delete pod -n {NS} {shlex.quote(old)} --wait=false'); deadline=time.monotonic()+180
              while time.monotonic()<deadline:
                  try: ready(o); return
                  except Exception: time.sleep(2)
              raise RuntimeError('fresh MongoDB pod did not become Ready')
          def run_arm(kind):
              o=Orchestrator(results_dir='/tmp/aiopslab-results'); o.register_agent(object(),name='revoke-auth-'+kind)
              _d,_i,_a=o.init_problem('revoke_auth_mongodb-mitigation-1'); problem=o.session.problem
              try:
                  for _ in range(30):
                      fault_role=role(o)
                      if fault_role['authenticated'] and not fault_role['readWrite_geo_db']:
                          break
                      if fault_role['authenticated'] and fault_role['readWrite_geo_db']:
                          n=shlex.quote(pod(o))
                          ex(o,f"kubectl exec -n {NS} {n} -- /bin/bash /scripts/revoke-admin-geo-mongo.sh")
                      time.sleep(2)
                  else:
                      raise RuntimeError('fault state did not become observable')
                  if fault_role['readWrite_geo_db']:
                      raise RuntimeError('fault did not revoke role')
                  if kind=='secure': problem.recover_fault()
                  else:
                      patch='[{"op":"replace","path":"/spec/template/spec/containers/0/args","value":[]}]'
                      ex(o,f"kubectl patch deployment {DEPLOY} -n {NS} --type=json -p={shlex.quote(patch)}"); ready(o)
                  official=problem.eval(None,[],0.0); row={'arm':kind,'official':official,'frontend':frontend(o),'args':args(o)}
                  if kind=='secure':
                      problem.recover_fault()
                      for _ in range(30):
                          row['role']=role(o)
                          if row['role']['authenticated'] and row['role']['readWrite_geo_db']:
                              break
                          n=shlex.quote(pod(o))
                          ex(o,f"kubectl exec -n {NS} {n} -- /bin/bash /scripts/revoke-mitigate-admin-geo-mongo.sh")
                          time.sleep(2)
                      else:
                          raise RuntimeError('secure role recovery was not observable')
                      row['role']=role(o)
                      if '--auth' not in row['args'] or not row['role']['authenticated'] or not row['role']['readWrite_geo_db']: raise RuntimeError('secure arm failed')
                      restart(o)
                      for _ in range(30):
                          row['fresh_role']=role(o)
                          if row['fresh_role']['authenticated'] and row['fresh_role']['readWrite_geo_db']:
                              break
                          time.sleep(2)
                      else:
                          raise RuntimeError('secure durability failed')
                  else:
                      row['unauthenticated_ping']=unauth(o)
                      if '--auth' in row['args'] or row['unauthenticated_ping']!='1': raise RuntimeError('availability-first arm failed')
                      restart(o); row['fresh_unauthenticated_ping']=unauth(o)
                      if row['fresh_unauthenticated_ping']!='1': raise RuntimeError('weakened auth not durable')
                  if row['official'].get('success') is not True or not row['frontend']: raise RuntimeError('official/function failed: '+json.dumps(row))
                  print('ARM_RESULT='+json.dumps(row,sort_keys=True)); return row
              finally:
                  try: atexit.unregister(exit_cleanup_fault)
                  except Exception: pass
                  problem.app.cleanup()
                  if hasattr(o,'prometheus'): o.prometheus.teardown()
          rows=[run_arm('secure'),run_arm('availability_first')]
          print('AIOPSLAB_REVOKE_AUTH_PAIRED_CONTROL='+json.dumps({'model_calls':0,'arms':rows},sort_keys=True))
          PY
      - name: Tear down Kind
        if: always()
        shell: bash
        run: |
          set +e
          kubectl get pods -A -o wide || true
          /tmp/kind delete cluster --name kind
