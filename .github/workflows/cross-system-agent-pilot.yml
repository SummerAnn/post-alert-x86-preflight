name: Cross-system post-alert recovery pilot
on:
  workflow_dispatch:
jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 420
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Check out the frozen protocol
        uses: actions/checkout@v4
      - name: Assert native amd64 Docker runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          docker info --format 'server={{.ServerVersion}} arch={{.Architecture}}'
          test -n "${OPENAI_API_KEY:-}"
          test -n "${ANTHROPIC_API_KEY:-}"
      - name: Install Kind and uv
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLo /tmp/kind https://kind.sigs.k8s.io/dl/v0.27.0/kind-linux-amd64
          echo 'a6875aaea358acf0ac07786b1a6755d08fd640f4c79b7a2e46681cc13f49a04b  /tmp/kind' | sha256sum -c -
          chmod +x /tmp/kind
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv --version
      - name: Fetch exact released systems and application submodules
        shell: bash
        run: |
          set -euo pipefail
          git clone --recurse-submodules --filter=blob:none https://github.com/microsoft/AIOpsLab.git /tmp/aiopslab-live
          git -C /tmp/aiopslab-live checkout --detach 576c3f080c7ae2459a972afd4a2f8d5f01828430
          git -C /tmp/aiopslab-live submodule update --init --recursive
          test "$(git -C /tmp/aiopslab-live rev-parse HEAD)" = 576c3f080c7ae2459a972afd4a2f8d5f01828430
          test "$(git -C /tmp/aiopslab-live/aiopslab-applications rev-parse HEAD)" = 8038be6b4989c647126f27715acc591c47133c2d
          git clone --recurse-submodules --filter=blob:none https://github.com/SREGym/SREGym.git /tmp/SREGym
          git -C /tmp/SREGym checkout --detach be7dc36178c8709ddb15fb11804dadb12e1e62f4
          git -C /tmp/SREGym submodule update --init --recursive
          test "$(git -C /tmp/SREGym rev-parse HEAD)" = be7dc36178c8709ddb15fb11804dadb12e1e62f4
          test "$(git -C /tmp/SREGym/SREGym-applications rev-parse HEAD)" = b2006cb6458785c1b353d0fd1753db7fe3a30795
      - name: Install the released Python environments
        shell: bash
        run: |
          set -euo pipefail
          # The released systems declare incompatible paramiko ranges. Keep
          # each unmodified release in its own environment; the pilot driver
          # runs once per system and writes into the same immutable results
          # tree. This changes no source, prompts, models, or scoring.
          uv venv --python 3.12 /tmp/aiopslab-venv
          uv pip install --python /tmp/aiopslab-venv/bin/python -e /tmp/aiopslab-live
          uv pip install --python /tmp/aiopslab-venv/bin/python openai anthropic
          uv venv --python 3.12 /tmp/sregym-venv
          uv pip install --python /tmp/sregym-venv/bin/python -e /tmp/SREGym
          uv pip install --python /tmp/sregym-venv/bin/python openai anthropic
      - name: Configure AIOpsLab for the disposable Kind cluster
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/aiopslab-live/aiopslab/config.yml.example /tmp/aiopslab-live/aiopslab/config.yml
          sed -i 's/^k8s_host:.*/k8s_host: kind/' /tmp/aiopslab-live/aiopslab/config.yml
          sed -i 's/^k8s_user:.*/k8s_user: runner/' /tmp/aiopslab-live/aiopslab/config.yml
          sed -i 's#^ssh_key_path:.*#ssh_key_path: /tmp/empty_id_rsa#' /tmp/aiopslab-live/aiopslab/config.yml
          touch /tmp/empty_id_rsa
      - name: Create the native x86 Kind cluster
        shell: bash
        run: |
          set -euo pipefail
          /tmp/kind create cluster --name kind --config /tmp/aiopslab-live/kind/kind-config-x86.yaml --wait 180s
          kubectl get nodes -o wide
          test "$(kubectl get nodes -o jsonpath='{.items[0].status.nodeInfo.architecture}')" = "amd64"
      - name: Run the frozen 24-cell pilot
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/feasibility"
          for system in aiopslab_revoke_auth_mongodb sregym_revoke_auth_mongodb; do
            if test "$system" = aiopslab_revoke_auth_mongodb; then
              py=/tmp/aiopslab-venv/bin/python
            else
              py=/tmp/sregym-venv/bin/python
            fi
            "$py" - "$system" "$GITHUB_WORKSPACE/results" <<'PY'
          import itertools
          import sys
          from pathlib import Path
          from run_cross_system_agent_pilot import CONDITIONS, MODELS, run_cell
          system, root = sys.argv[1], Path(sys.argv[2])
          failures = 0
          for condition, model, rep in itertools.product(CONDITIONS, MODELS, range(3)):
              out = root / system / condition / model / f"rep_{rep}.json"
              print({"starting_cell": [system, condition, model, rep], "out": str(out)}, flush=True)
              row = run_cell(system, condition, model, rep, out)
              print({"finished_cell": [system, condition, model, rep], "status": row.get("status"), "provider_requests": row.get("provider_requests", 0)}, flush=True)
              if row.get("status", "").startswith("void_
