name: AIOpsLab official deployment smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Install Python and Helm
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - name: Install pinned Kind
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLo /tmp/kind https://kind.sigs.k8s.io/dl/v0.27.0/kind-linux-amd64
          echo 'a6875aaea358acf0ac07786b1a6755d08fd640f4c79b7a2e46681cc13f49a04b  /tmp/kind' | sha256sum -c -
          chmod +x /tmp/kind
          /tmp/kind version
          kubectl version --client=true
      - name: Fetch the pinned AIOpsLab release
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/microsoft/AIOpsLab.git /tmp/aiopslab
          git -C /tmp/aiopslab checkout --detach 576c3f080c7ae2459a972afd4a2f8d5f01828430
          cp /tmp/aiopslab/aiopslab/config.yml.example /tmp/aiopslab/aiopslab/config.yml
          sed -i 's/^k8s_host:.*/k8s_host: kind/' /tmp/aiopslab/aiopslab/config.yml
          sed -i 's/^k8s_user:.*/k8s_user: runner/' /tmp/aiopslab/aiopslab/config.yml
          sed -i 's/^qualitative_eval:.*/qualitative_eval: false/' /tmp/aiopslab/aiopslab/config.yml
      - name: Create the official Kind cluster
        shell: bash
        run: |
          set -euo pipefail
          /tmp/kind create cluster --name kind --config /tmp/aiopslab/kind/kind-config-x86.yaml --wait 180s
          kubectl get nodes -o wide
          test "$(kubectl get nodes -o jsonpath='{.items[0].status.nodeInfo.architecture}')" = amd64
      - name: Install AIOpsLab and initialize one official problem
        working-directory: /tmp/aiopslab
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e .
          python - <<'PY'
          import os
          from aiopslab.orchestrator import Orchestrator

          # The no-op task exercises the released deployment lifecycle without
          # model calls or a fault mutation.
          os.environ['AIOPSLAB_CLUSTER'] = 'kind'
          orchestrator = Orchestrator(results_dir='/tmp/aiopslab-results')
          orchestrator.register_agent(object(), name='deployment-smoke')
          description, instructions, actions = orchestrator.init_problem('noop_detection_hotel_reservation-1')
          problem = orchestrator.session.problem
          print('INITIALIZED_PROBLEM=', problem.pid)
          print('NAMESPACE=', problem.namespace)
          print('DESCRIPTION_CHARS=', len(description))
          print('ACTION_COUNT=', len(actions))
          print(orchestrator.kubectl.exec_command('kubectl get pods -A -o wide'))
          # Exercise the official cleanup path before the process exits.
          problem.recover_fault()
          problem.app.cleanup()
          if hasattr(orchestrator, 'prometheus'):
              orchestrator.prometheus.teardown()
          print('AIOPSLAB_DEPLOYMENT_SMOKE=PASS')
          PY
      - name: Verify cleanup and tear down Kind
        if: always()
        shell: bash
        run: |
          set +e
          kubectl get pods -A -o wide || true
          kubectl delete -f https://openebs.github.io/charts/openebs-operator.yaml --ignore-not-found=true || true
          /tmp/kind delete cluster --name kind
