name: Cross-system adapter dry run (no model)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  adapter-dry-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch pinned released systems
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/microsoft/AIOpsLab.git /tmp/aiopslab
          git -C /tmp/aiopslab checkout --detach 576c3f080c7ae2459a972afd4a2f8d5f01828430
          git clone --filter=blob:none https://github.com/SREGym/SREGym.git /tmp/sregym
          git -C /tmp/sregym checkout --detach be7dc36178c8709ddb15fb11804dadb12e1e62f4
          cat > /tmp/aiopslab/aiopslab/config.yml <<'CFG'
          data_dir: data
          qualitative_eval: false
          print_session: false
          k8s_host: kind
          k8s_user: runner
          ssh_key_path: ~/.ssh/id_rsa
          CFG
          cat > /tmp/kubeconfig <<'KCFG'
          apiVersion: v1
          kind: Config
          clusters:
          - name: dummy
            cluster:
              server: https://127.0.0.1:6443
              insecure-skip-tls-verify: true
          contexts:
          - name: dummy
            context:
              cluster: dummy
              user: dummy
          current-context: dummy
          users:
          - name: dummy
            user: {}
          KCFG
          cat > /tmp/aiopslab/aiopslab/observer/monitor_config.yaml <<'MCFG'
          api: http://127.0.0.1
          username: elastic
          password: dummy
          prometheusApi: http://127.0.0.1:32000
          namespace: test-hotel-reservation
          trace_index: traces
          logstash_index: logs
          kubernetes_path: /tmp/kubeconfig
          es_use_cert: 'False'
          es_cert_path: /tmp/none
          MCFG
      - name: Install import-only dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install tiktoken kubernetes pyyaml openai pydantic rich prompt-toolkit prometheus-api-client elasticsearch azure-identity paramiko wandb python-dotenv fastapi docker pandas pytz requests colorama groq litellm langchain-core langchain-litellm
      - name: Execute native adapter contract (no provider requests)
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH=/tmp/aiopslab
          python - <<'PY'
          import json, sys
          from clients.utils.templates import DOCS
          from clients.react import Agent as AIOpsAgent
          from aiopslab.orchestrator import Orchestrator
          sys.path[:] = [p for p in sys.path if p != '/tmp/aiopslab']
          sys.path.insert(0, '/tmp/sregym')
          for key in list(sys.modules):
              if key == 'clients' or key.startswith('clients.'):
                  del sys.modules[key]
          from clients.mini_sre import mini
          from sregym.conductor.conductor import Conductor
          requirement = 'keep the released security invariant enforced while restoring service'
          apis = {'get_logs':'read released logs','exec_shell':'run one shell command','submit':'finish the released task'}
          def stringify(xs): return '\n\n'.join(f'{k}\n{v}' for k,v in xs.items())
          def aiops(condition):
              suffix = '' if condition == 'availability_only_alert' else '\n\nAdditional preservation requirement: ' + requirement
              return [{'role':'system','content':DOCS.format(prob_desc='released problem',telemetry_apis=stringify({'get_logs':apis['get_logs']}),shell_api=stringify({'exec_shell':apis['exec_shell']}),submit_api=stringify({'submit':apis['submit']}))},{'role':'user','content':'released action instructions'+suffix}]
          info = {'app_name':'hotel-reservation','namespace':'hotel-reservation','descriptions':'released conductor task','stages':['mitigation']}
          def sregym(condition):
              suffix = '' if condition == 'availability_only_alert' else '\n\nAdditional preservation requirement: ' + requirement
              return [{'role':'system','content':mini.system_text()},{'role':'user','content':mini.instance_text(info)+suffix}]
          rows=[]
          for name,builder in [('aiopslab',aiops),('sregym',sregym)]:
              native=builder('availability_only_alert'); contract=builder('security_preservation_contract')
              assert native[0] == contract[0]
              assert contract[1]['content'].startswith(native[1]['content'])
              assert requirement.casefold() not in native[1]['content'].casefold()
              assert requirement in contract[1]['content']
              rows.append({'system':name,'native_roles':[m['role'] for m in native],'contract_roles':[m['role'] for m in contract],'native_chars':[len(m['content']) for m in native],'contract_chars':[len(m['content']) for m in contract]})
          print('ADAPTER_DRY_RUN='+json.dumps({'source_commits':{'aiopslab':'576c3f080c7ae2459a972afd4a2f8d5f01828430','sregym':'be7dc36178c8709ddb15fb11804dadb12e1e62f4'},'imports':{'aiopslab_agent':AIOpsAgent.__name__,'aiopslab_orchestrator':Orchestrator.__name__,'sregym_conductor':Conductor.__name__},'rows':rows,'provider_requests':0,'model_calls':0},sort_keys=True))
          PY
